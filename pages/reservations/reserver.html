<div class="hero-scene text-white text-center">
   <div class="hero-scene-content">
       <h1>Ma réservation</h1>  
   </div>
</div>

<div class="container">

  <form>

    <div class="mb-3">
      <label for="NomInputResa" class="form-label">Nom</label>
      <input type="text" class="form-control" id="NomInputResa"  placeholder="Votre nom" value="">
      <div class="invalid-feedback">
        Le nom est requis.
      </div>
    </div>

    <div class="mb-3">
      <label for="PrenomInputResa" class="form-label">Prénom</label>
      <input type="text" class="form-control" id="PrenomInputResa"  placeholder="Votre prénom" value="">
      <div class="invalid-feedback">
        Le prénom est requis.
      </div>
    </div>

    <div class="mb-3">
      <label for="AllergieInput" class="form-label">Allergies</label>
      <input type="text" class="form-control" id="AllergieInput" placeholder="Vos allergies" value="">
    </div>

    <div class="mb-3">
      <label for="NbConvivesInput" class="form-label">Nombre de convives habituel</label>
      <input type="number" class="form-control" id="NbConvivesInput" placeholder="Combien vous êtes habituellement ?" value="">
      <div class="invalid-feedback">
        Le nombre de convives est requis.
      </div>
    </div>
    
    <div class="mb-3">
      <label for="DateInput" class="form-label">Date</label>
      <input type="date" class="form-control" id="DateInput" placeholder="" value="">
    </div>

    <div class="mb-3">
    <div class="form-check">
      <input class="form-check-input" type="radio" name="serviceChoisi" id="midiRadio">
      <label class="form-check-label" for="midiRadio">Midi</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="serviceChoisi" id="soirRadio" checked>
        <label class="form-check-label" for="soirRadio">
          Soir
       </label>
     </div>
    </div>

    <div class="mb-3">
        <label for="selectHour" class="form-label">Heure</label>
        <select class="form-select" id="selectHour">
            <option >19:30</option>
            <option >19:45</option>
            <option >20:00</option>
            <option >20:15</option>
            <option >20:30</option>
            <option >20:45</option>
            <option >21:00</option>
        </select>
        <div class="invalid-feedback">
        Un horaire est requis.
      </div>
    </div>
    
    <div class="text-center">  
      <button type="submit" class="btn btn-primary" id="btn-validation-inscription">Réserver</button>
      <button type="button" class="btn btn-danger">Annuler</button>
    </div>

  </form>

</div>
